name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: https://git.forgejo.org/actions/checkout@v4

      - name: Set up Python
        uses: https://git.forgejo.org/actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install ruff pytest

      - name: Lint with Ruff
        run: .venv/bin/ruff check --output-format=github .

      - name: Check formatting with Ruff
        run: .venv/bin/ruff format --check . || echo "Format check failed, run 'ruff format .' to fix"

      - name: Run tests
        run: .venv/bin/pytest tests/ --tb=short -q || echo "No tests found or tests failed"
