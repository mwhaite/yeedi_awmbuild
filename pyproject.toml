[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "yeedi-awmbuild"
version = "0.1.0"
description = "Yeedi Home Assistant integration (AWM build)"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.bandit]
exclude_dirs = [".venv"]
skips = ["B101"]  # allow assert statements in tests
